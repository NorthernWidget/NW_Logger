name=NW_Logger
version=0.0.0
author=Bobby Schulz and Andrew D. Wickert; Northern Widget
maintainer=Northern Widget
sentence=The logger core that the Margay and Okapi data-logger libraries share: the card layout, the data and status files, the run loop, the interrupts, the self-tests and the LED.
paragraph=NW_Logger is the base class of Margay and Okapi. It keeps the logger's own Schema 1 pages (NW_Core), writes a numbered pair of data and status files in a serial-numbered folder, watches sensors for the status file, runs the alarm, button and external-interrupt triggers, and sleeps between them. A board's library inherits it and fills in its power rails, its on-board columns and its reading of itself. Unversioned during the 2026 overhaul.
category=Data Storage
url=https://github.com/NorthernWidget/NW_Logger
architectures=avr
depends=NW_Core, DS3231_Logger, SdFat, NW_BME280, Adafruit BME280 Library
